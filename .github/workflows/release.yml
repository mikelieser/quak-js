# A tag like v0.9.1 (from `bun release patch`) publishes the package to npm with Trusted Publishing: npm trusts this
# workflow via OIDC, there is no NPM_TOKEN. Provenance comes with it automatically (public repo, public package).
# npmjs.com → @quak/js → Settings → Trusted publishing must name quakparty/quak-js and release.yml, with direct
# publishing allowed (new configurations only allow `npm stage publish` by default since 03.09.2026). The very first
# version (0.9.0) was published by hand, trusted publishing needs an existing package.
#
# Order: the tag must match package.json, then the complete CI (ci.yml: format, types, tests, build, README tables,
# the packed tarball on Node 20/22/24 and Deno), then exactly the tarball CI packed and tested goes to npm.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          test "$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME, package.json $version"; exit 1; }

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pack
      # Trusted Publishing needs Node >= 22.14 and npm >= 11.5.1
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@12.1.0
      # A tarball is published as it is, without lifecycle scripts: CI already checked and built it.
      # "./": without it npm 12 reads pack/<file>.tgz as the GitHub shorthand user/repo
      - run: npm publish ./pack/*.tgz --access public

  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          cat notes.md
      - name: GitHub release (pre-release while 0.x)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in v0.*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $flags

  # Exactly one announcement per release on Mike's Sonos (quak-api/docs/deploy-notifications.md): quak-js-released when
  # the package reached npm, else quak-js-failed, also when the tag check or CI stopped it. None for cancelled runs.
  # The action never fails the run, quiet hours skip the play for free.
  announce:
    needs: publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      # Plays a short clip on our Sonos speakers when a release is out: https://quak.party/apps/github
      - name: Announce with Quak on Sonos
        uses: quakparty/quak-github-action@v1
        with:
          api-key: ${{ secrets.QUAK_API_KEY }}
          type: clip
          clip: ${{ needs.publish.result == 'success' && 'quak-js-released' || 'quak-js-failed' }}
          to: schlafzimmer
          volume: 15
          quiet-hours: 21-8
